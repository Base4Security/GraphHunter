[package]
name = "graph_hunter_cli"
version = "1.0.0"
edition = "2024"
description = "Long-running CLI process for Graph Hunter — stdin/stdout JSON protocol"

[lib]
name = "graph_hunter_cli"
path = "src/lib.rs"

[[bin]]
name = "graph_hunter_cli"
path = "src/main.rs"

[dependencies]
graph_hunter_core = { path = "../../core/graph-engine" }
# SIEM transports were extracted into platform/siem (ADR-001 cycle
# break). The CLI re-exports them under the old `graph_hunter_cli::siem`
# path so callers migrate lazily.
graph_hunter_siem = { path = "../../platform/siem" }
# mimalloc as global allocator for the CLI binary. Drop-in win on
# alloc-heavy paths (DFS scratch, ingest). default-features=false skips
# the override-malloc-symbols mode we don't need on Windows/musl.
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
