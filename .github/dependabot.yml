version: 2
updates:
  # Rust crates - 14 separate Cargo.toml manifests (no [workspace] root).
  # Use lockfile-only so dependabot does not fight with manual CVE bumps (e.g. PR #74).
  - package-ecosystem: cargo
    directory: /apps/cli
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /apps/tauri/src-tauri
    schedule:
      interval: weekly
