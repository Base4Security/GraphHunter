# Análisis estático de seguridad (SAST) con CodeQL.
#
# El estándar todavía no fijó herramienta de SAST (PENDIENTE de la célula en
# Dev-Baseline/plantillas/ci/README.md). CodeQL se eligió porque es gratuito en
# el repo público y analiza los cuatro lenguajes del repo sin compilar.
# En un repo privado requiere GitHub Advanced Security.

name: sast

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # semanal: detecta reglas nuevas sobre código que no cambió

permissions: {}

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
