name: docs

on:
  pull_request:
    paths:
      - 'docs/libro/**'
      - 'tools/extract-listings.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/libro/**'
      - 'tools/extract-listings.py'

jobs:
  build-libro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar TeX Live (minimo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-lang-spanish \
            texlive-science \
            biber \
            python3-pygments

      - name: Instalar fuentes opcionales (EB Garamond / Lato / JetBrains Mono)
        run: |
          sudo apt-get install -y \
            fonts-ebgaramond \
            fonts-lato \
            fonts-jetbrains-mono || true
          fc-cache -fv

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build libro (make all)
        run: make -C docs/libro all

      - name: Verificar libro.pdf existe
        run: |
          test -f docs/libro/libro.pdf
          ls -lh docs/libro/libro.pdf

      - name: Upload libro.pdf
        uses: actions/upload-artifact@v4
        with:
          name: libro
          path: docs/libro/libro.pdf
          retention-days: 30
