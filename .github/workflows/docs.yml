name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

jobs:
  build-pdfs:
    name: Build 4 PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build arquitectura
        working-directory: docs
        run: make arquitectura

      - name: Build especificacion
        working-directory: docs
        run: make especificacion

      - name: Build manual
        working-directory: docs
        run: make manual

      - name: Build paper
        working-directory: docs
        run: make paper

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: graphhunter-docs-pdfs
          path: |
            docs/arquitectura/arquitectura.pdf
            docs/especificacion/especificacion.pdf
            docs/manual/manual.pdf
            docs/paper/paper.pdf
          retention-days: 30
