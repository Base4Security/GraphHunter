# Controles del estándar de desarrollo de Base4 Security que no cubre rust-ci.yml.
# Plantilla de origen: Dev-Baseline/plantillas/ci/baseline.yml.
#
# Corre en todo PR, sin filtro de rutas: un check requerido que no se dispara
# deja el PR sin poder mergear (o, peor, se configura como opcional).

name: baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- BLOQUEANTE
  secretos:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # escanea el historial completo, no solo el último commit
          persist-credentials: false

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escaneo de secretos
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
