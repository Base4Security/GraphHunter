name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust core crate ────────────────────────────────────────────────
  core-tests:
    name: Core (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/graph-engine
      # --test-threads=1: planner / dispatch tests mutate process-wide
      # env vars (GRAPHHUNTER_LFTJ_PLANNER, _C6_LFTJ, etc.); parallel
      # runs race and the failures depend on scheduling. Pin serial
      # execution for the env-coupled suite. Per-test runtime is
      # sub-millisecond so the wall-clock cost is negligible.
      - name: Run tests (skip long benchmarks)
        run: cargo test --manifest-path core/graph-engine/Cargo.toml -- --skip benchmark --test-threads=1
      - name: Run tests (geoip feature)
        run: cargo test --manifest-path core/graph-engine/Cargo.toml --features geoip -- --skip benchmark --test-threads=1

  # ── Tauri backend compile check ────────────────────────────────────
  tauri-check:
    name: Tauri (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Tauri v2 on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      # --no-default-features skips custom-protocol which requires a
      # pre-built frontend dist/. We only need to verify Rust compiles.
      - name: Cargo check
        run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --no-default-features

  # ── Frontend (TypeScript + Vitest) ─────────────────────────────────
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: apps/tauri
      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/tauri
      - name: Unit tests
        run: npm test
        working-directory: apps/tauri

  # ── MCP server (new modular package) ───────────────────────────────
  # Canonical per ADR-004. The legacy `graph-hunter-mcp/` package is
  # kept on disk for one release cycle so analysts pinning the 1.3.0
  # binary can still build it locally; CI only exercises the new one.
  mcp:
    name: MCP (tsc build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/mcp/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: platform/mcp
      - name: Build
        run: npm run build
        working-directory: platform/mcp

  # ── Bench regression gate (F3.7) ───────────────────────────────────
  # Runs the Criterion benches against main as baseline, then against
  # the PR HEAD, and fails if any bench regresses more than 5%. Only
  # runs on pull_request to avoid a lonely "regression vs itself" on
  # push-to-main.
  bench-regression:
    name: Benchmarks (regression gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/graph-engine
      # Run benches on the merge target first (baseline). If the base
      # commit predates the repo layout reorg (no `core/graph-engine`
      # manifest), skip the baseline and emit a notice — the gate is a
      # no-op until a PR with the new layout lands on main, after which
      # subsequent PRs gate normally.
      - name: Baseline bench (main)
        id: baseline
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          if [ ! -f core/graph-engine/Cargo.toml ]; then
            echo "::notice::base sha lacks core/graph-engine layout; skipping bench gate this run"
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo bench --manifest-path core/graph-engine/Cargo.toml \
            --bench hunt_latency -- --save-baseline main --warm-up-time 1 --measurement-time 3
          cargo bench --manifest-path core/graph-engine/Cargo.toml \
            --bench dedup_throughput -- --save-baseline main --warm-up-time 1 --measurement-time 3
      - name: PR bench
        if: steps.baseline.outputs.skipped != '1'
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          cargo bench --manifest-path core/graph-engine/Cargo.toml \
            --bench hunt_latency -- --save-baseline pr --warm-up-time 1 --measurement-time 3
          cargo bench --manifest-path core/graph-engine/Cargo.toml \
            --bench dedup_throughput -- --save-baseline pr --warm-up-time 1 --measurement-time 3
      # Compare per-bench mean point-estimate straight from Criterion's
      # estimates.json outputs. Gate fails if any PR estimate exceeds
      # 1.05 × main estimate (>5% slower). Parsing the raw JSON beats
      # scraping critcmp's formatted output, which is brittle.
      - name: Compare and gate (>5% regression fails)
        if: steps.baseline.outputs.skipped != '1'
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          roots = glob.glob("core/graph-engine/target/criterion/**/main/estimates.json", recursive=True)
          failures = []
          for main_path in roots:
              pr_path = main_path.replace("/main/estimates.json", "/pr/estimates.json")
              if not os.path.exists(pr_path):
                  continue
              with open(main_path) as f: main_mean = json.load(f)["mean"]["point_estimate"]
              with open(pr_path)   as f: pr_mean   = json.load(f)["mean"]["point_estimate"]
              bench = main_path.split("/target/criterion/")[1].split("/main/")[0]
              ratio = pr_mean / main_mean if main_mean > 0 else 1.0
              status = "REGRESSION" if ratio > 1.05 else "ok"
              print(f"{status:11} {bench:40} main={main_mean:.3e}  pr={pr_mean:.3e}  ratio={ratio:.3f}")
              if ratio > 1.05:
                  failures.append((bench, ratio))
          if failures:
              print(f"\n{len(failures)} benchmark(s) regressed >5% vs main — failing.")
              sys.exit(1)
          PY

  # ── Cross-platform platform-crate matrix (F12.5) ───────────────────
  # The agentic LLM-as-compiler path lives in platform/ crates and must
  # build & test cleanly on Linux *and* macOS. This is the BH-Arsenal
  # tractability gate — proving the project isn't Windows-locked. The
  # job avoids C++ deps (libgraphmatch SIMD is x86-AVX2 and gated off)
  # and Tauri (needs GUI system libs). What runs here is pure-Rust:
  # the VRL compiler, the constrained-decode validator + xgrammar
  # primitive (llguidance/toktrie are cross-platform), the local-llm
  # mock, and the canonical projection.
  platform-matrix:
    name: Platform crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Rust-cache picks up the per-crate target/ dirs; listing the
          # workspaces here keeps the cache key per-job.
          workspaces: |
            platform/constrained-decode
            platform/vrl
            platform/local-llm
            platform/canonical
      - name: Test constrained-decode (default features)
        run: cargo test --manifest-path platform/constrained-decode/Cargo.toml
      - name: Test constrained-decode (xgrammar feature)
        run: cargo test --manifest-path platform/constrained-decode/Cargo.toml --features xgrammar
      - name: Test VRL compiler
        run: cargo test --manifest-path platform/vrl/Cargo.toml
      - name: Test local-llm (mock backend)
        run: cargo test --manifest-path platform/local-llm/Cargo.toml
      - name: Test canonical projection
        run: cargo test --manifest-path platform/canonical/Cargo.toml

  # ── Layering guard (shearing architecture) ─────────────────────────
  # Rejects any core/* -> platform/* path dep outside the whitelist at
  # docs/arquitectura/layering-exceptions.txt. A new edge requires an
  # ADR and a whitelist entry in the same PR.
  layering:
    name: Layering guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check core -> platform dependencies
        run: bash scripts/check-layering.sh

  # ── Clippy lint (core) ─────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/graph-engine
      # Warn on all lints but only deny correctness issues. The codebase
      # has pre-existing style warnings (collapsible_if, etc.) that will
      # be cleaned up incrementally — blocking CI on them is premature.
      - name: Clippy (core)
        run: cargo clippy --manifest-path core/graph-engine/Cargo.toml -- -W clippy::all -D clippy::correctness
