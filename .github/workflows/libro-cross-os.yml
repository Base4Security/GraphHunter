name: libro-cross-os

# Builds the libro on Linux AND Windows, twice per OS, and asserts the
# sha256(libro.pdf) is bit-identical across the two builds — i.e. the build
# is reproducible (no stray timestamps, no host-dependent paths embedded).
#
# Why a SEPARATE workflow from docs.yml:
#   - docs.yml is the fast Linux-only smoke. It runs on every libro PR and
#     just checks "does it build at all". libro-cross-os.yml is the heavier
#     reproducibility + Windows-compat gate that we still want green before
#     v1.0.0 OSS release.
#   - Different concurrency group → both can run on the same PR without
#     cancelling each other.

on:
  pull_request:
    paths:
      - 'docs/libro/**'
      - 'build-libro.sh'
      - 'Makefile'
      - '.github/workflows/libro-cross-os.yml'
  push:
    branches:
      - main
      - docs/libro-m9-pulido

concurrency:
  group: libro-cross-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pygments (for minted)
        shell: bash
        run: python -m pip install --upgrade Pygments

      - name: Install TeX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-lang-spanish \
            texlive-science \
            biber \
            latexmk \
            fonts-ebgaramond \
            fonts-lato \
            fonts-jetbrains-mono
          fc-cache -fv

      - name: Install TeX (Windows)
        if: matrix.os == 'windows-latest'
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: scheme-full

      - name: Build libro (1st pass for reproducibility check)
        shell: bash
        run: bash build-libro.sh --clean

      - name: Capture sha256 of first build
        shell: bash
        run: |
          sha256sum docs/libro/libro.pdf | tee libro-sha-1.txt

      - name: Build libro (2nd pass)
        shell: bash
        run: bash build-libro.sh --clean

      - name: Capture sha256 of second build
        shell: bash
        run: |
          sha256sum docs/libro/libro.pdf | tee libro-sha-2.txt

      - name: Verify reproducibility
        shell: bash
        run: |
          # Compare only the hex digest — the filename column would only
          # differ if we hashed different paths, which we don't.
          SHA1=$(awk '{print $1}' libro-sha-1.txt)
          SHA2=$(awk '{print $1}' libro-sha-2.txt)
          echo "1st build sha256: ${SHA1}"
          echo "2nd build sha256: ${SHA2}"
          if [[ "${SHA1}" != "${SHA2}" ]]; then
            echo "::error::Build is NOT reproducible — different sha256 between runs"
            exit 1
          fi
          echo "Build is reproducible (sha256 matches)"

      - name: Upload libro.pdf
        uses: actions/upload-artifact@v4
        with:
          name: libro-${{ matrix.os }}.pdf
          path: docs/libro/libro.pdf
          retention-days: 7

      - name: Upload reproducibility hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libro-sha-${{ matrix.os }}
          path: |
            libro-sha-1.txt
            libro-sha-2.txt
          retention-days: 7
