name: bench-regression

on:
  pull_request:
    paths:
      - 'core/graph-engine/**'
      - '.github/workflows/bench-regression.yml'
  push:
    branches: [main]
    paths:
      - 'core/graph-engine/**'
      - '.github/workflows/bench-regression.yml'

concurrency:
  group: bench-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench-hunt-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core/graph-engine

      - name: Restore Criterion baseline (main)
        run: |
          BASE="core/graph-engine/benches/baseline/criterion"
          DEST="core/graph-engine/target/criterion"
          mkdir -p "$DEST"
          cp -r "$BASE/." "$DEST/"

      - name: Bench hunt_latency vs baseline
        continue-on-error: true
        run: |
          cargo bench --manifest-path core/graph-engine/Cargo.toml --bench hunt_latency -- --baseline main
