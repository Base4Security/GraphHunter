[package]
name = "graph_hunter_vrl"
version = "0.1.0"
edition = "2024"
description = "Deterministic FieldConfig -> VRL compiler and minimal interpreter. Ships the M3 fast-lane wedge: pure projection, no embedded vrl runtime yet, no LLM."
license = "GPL-3.0"

[lib]
name = "graph_hunter_vrl"
path = "src/lib.rs"

[dependencies]
graph_hunter_core = { path = "../../core/graph-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
graph_hunter_canonical = { path = "../canonical" }
