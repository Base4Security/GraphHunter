[package]
name = "graph-hunter-app"
version = "1.0.0"
edition = "2021"

[lib]
name = "graph_hunter_app_lib"
# Removed "staticlib" from crate-type (was previously ["staticlib",
# "cdylib", "rlib"]). Tauri v2 only needs "cdylib" (for the runtime
# entry point) and "rlib" (for Rust tests / the main binary's link).
# The "staticlib" output was producing a ~1.5 GB .lib file on every
# build — a disk-pressure foot-gun on constrained dev machines. Add
# it back if a non-Rust consumer ever needs to statically link the
# library.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
memmap2 = "0.9"
graph_hunter_core = { path = "../../graph_hunter_core", features = ["ml-scoring"] }
graph_hunter_cli = { path = "../../graph_hunter_cli" }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
dotenvy = "0.15"
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
evtx = { version = "0.11", default-features = false }
memchr = "2"
rayon = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Azure streaming smoke test (Phase 8 frontend validation)
# These are transitive through graph_hunter_core; declared explicitly so
# azure_streaming_smoke.rs can use them by name. Small / already-compiled.
async-trait = "0.1"
futures = "0.3"
bytes = "1"
tempfile = "3"

[features]
# Opt-in: enable with --features simd. Runtime falls back to pure-Rust DFS when AVX2 is unavailable.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
simd = ["graph_hunter_core/simd"]
