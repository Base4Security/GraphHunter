[package]
name = "graph_hunter_tpcsa"
version = "0.1.0"
edition = "2024"
description = "Temporal Prize-Collecting Steiner Arborescence (TPCSA): temporal pruning, time-expanded DAG, greedy time-respecting forest, verification and ranking. Pure graph code, no engine dependency."
license = "GPL-3.0"

[lib]
name = "graph_hunter_tpcsa"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
